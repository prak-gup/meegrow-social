# Local dev infra only (Postgres + Redis). App/worker run on the host via pnpm dev.
services:
  postgres:
    image: postgres:17-alpine
    container_name: mgs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mgs
      POSTGRES_PASSWORD: mgs
      POSTGRES_DB: meegrow_social
    ports:
      - "5433:5432"
    volumes:
      - mgs-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgs -d meegrow_social"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.2-alpine
    container_name: mgs-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - mgs-redis:/data
volumes:
  mgs-pg:
  mgs-redis:
