# Production/staging stack for meegrow-social. Runs its OWN Postgres+Redis on a private network
# (safe to co-host on the Postiz box — nothing is published to the host except the API on
# 127.0.0.1:8990, which Caddy reverse-proxies for social.meegrowlabs.com).
#
# Deploy: on the box, in /opt/meegrow-social:
#   docker compose -f compose.prod.yml up -d --build
#   docker compose -f compose.prod.yml run --rm migrate   # applies migrations + RLS + mgs_app role
# Secrets come from /opt/meegrow-social/.env (NOT in git — see .env.production.example).
services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    image: meegrow-social:latest
    command: node apps/api/dist/index.js
    container_name: mgs-api
    restart: always
    env_file: .env
    # Feature switches that are not secrets live here, so turning one on is a reviewed change.
    # A value in the server's .env still wins.
    environment:
      WORDPRESS_ENABLED: ${WORDPRESS_ENABLED:-true}
      BLUESKY_ENABLED: ${BLUESKY_ENABLED:-true}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-true}
      SLACK_ENABLED: ${SLACK_ENABLED:-true}
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-true}
    ports: ['127.0.0.1:8990:8990']
    volumes: ['media:/app/.data/media']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    image: meegrow-social:latest
    command: node apps/worker/dist/index.js
    container_name: mgs-worker
    restart: always
    env_file: .env
    # Feature switches that are not secrets live here, so turning one on is a reviewed change.
    # A value in the server's .env still wins.
    environment:
      WORDPRESS_ENABLED: ${WORDPRESS_ENABLED:-true}
      BLUESKY_ENABLED: ${BLUESKY_ENABLED:-true}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-true}
      SLACK_ENABLED: ${SLACK_ENABLED:-true}
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-true}
    volumes: ['media:/app/.data/media']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # One-shot migration (idempotent). Run explicitly on each deploy; exits 0.
  migrate:
    image: meegrow-social:latest
    command: node packages/db/dist/migrate.js
    env_file: .env
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    container_name: mgs-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: mgs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meegrow_social
    volumes: ['pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mgs -d meegrow_social']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: mgs-prod-redis
    restart: always
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pg:
  redis:
  media:
